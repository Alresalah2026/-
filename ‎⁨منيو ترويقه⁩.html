<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو ترويقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f0df; --surface:#fffaf0; --text:#1b3828; --muted:#7b8a7f; --gold:#b08a35; --gold2:#d9bb6a; --green:#1f4d36; --onGreen:#f7f0df; --line:#e6d8b6; --shadow:0 6px 18px rgba(31,77,54,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f2019; --surface:#17302400; --surface:#173024; --text:#f4ebd3; --muted:#9db1a4; --gold:#d6b25e; --gold2:#ecd48c; --green:#d6b25e; --onGreen:#0f2019; --line:#2b4838; --shadow:0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f2019; --surface:#173024; --text:#f4ebd3; --muted:#9db1a4; --gold:#d6b25e; --gold2:#ecd48c; --green:#d6b25e; --onGreen:#0f2019; --line:#2b4838; --shadow:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 120px}
.hero{margin:0 -16px;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 14px 34px rgba(20,50,35,.22);border-bottom:3px solid var(--gold)}
.hero img{display:block;width:100%;height:auto}
.welcome{text-align:center;margin:20px 0 4px}
.welcome b{display:block;font-size:20px;font-weight:800;color:var(--green)}
.welcome span{font-size:14px;color:var(--muted)}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:10px 0 0}
.divider i{height:1px;width:70px;background:linear-gradient(to left,var(--gold),transparent)}
.divider i:last-child{transform:scaleX(-1)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 0;z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);color:var(--text);text-decoration:none;padding:7px 16px;border-radius:999px;font-weight:500;font-size:15px;background:var(--surface);transition:.2s}
nav a.on{background:var(--green);color:var(--onGreen);border-color:var(--green);font-weight:700}
section{margin-top:22px}
h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:22px;font-weight:800;color:var(--green)}
h2 .ic{font-size:22px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--gold),transparent)}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);animation:in .5s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;color:#5a3f06;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:1px 9px;border-radius:999px}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.price{font-weight:800;font-size:18px;color:var(--gold);margin-top:2px}
.price small{font-size:12px;font-weight:500;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--green);background:transparent;color:var(--green);font:700 20px/1 inherit;font-family:inherit;cursor:pointer;display:grid;place-items:center;padding:0}
.qty button.add{background:var(--green);color:var(--onGreen)}
.qty button:active{transform:scale(.92)}
.qty .n{min-width:28px;text-align:center;font-weight:800;font-size:16px}
.qty .hide{display:none}
.bar{position:fixed;left:12px;right:12px;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;transform:translateY(140%);transition:transform .3s ease;pointer-events:none}
.bar.show{transform:none;pointer-events:auto}
.bar>div{max-width:596px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--green);color:var(--onGreen);border-radius:20px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.bar .t{flex:1;font-size:13px;opacity:.85}
.bar .t b{display:block;font-size:20px;opacity:1;font-weight:800}
.bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 16px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.orn{text-align:center;color:var(--gold);margin-top:30px;letter-spacing:8px;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>

<script>
var MENU=[
 {id:"brioche",title:"البريوش",ic:"🥐",items:[

];
var qty={}, nav=document.getElementById("nav"), menu=document.getElementById("menu");
var delay=0;
MENU.forEach(function(s){
  var a=document.createElement("a");a.href="#"+s.id;a.id="n-"+s.id;a.innerHTML=s.ic+" "+s.title;nav.appendChild(a);
  var sec=document.createElement("section");sec.id=s.id;
  var h='<h2><span class="ic">'+s.ic+'</span>'+s.title+'</h2>';
  s.items.forEach(function(it,i){
    var k=s.id+i;qty[k]=0;
    h+='<div class="card" style="animation-delay:'+(delay+=0.06)+'s"><div class="info"><div class="name">'+it[0]+(it[3]?'<span class="badge">'+it[3]+'</span>':'')+'</div>'+(it[1]?'<div class="desc">'+it[1]+'</div>':'')+'<div class="price">'+it[2]+' <small>د</small></div></div>'
     +'<div class="qty" data-k="'+k+'" data-p="'+it[2]+'"><button class="minus hide" aria-label="إنقاص">−</button><span class="n hide">0</span><button class="plus add" aria-label="إضافة">+</button></div></div>';
  });
  sec.innerHTML=h;menu.appendChild(sec);
});
var bar=document.getElementById("bar"),totalEl=document.getElementById("total");
function refresh(){
  var t=0;
  document.querySelectorAll(".qty").forEach(function(q){
    var n=qty[q.dataset.k];t+=n*Number(q.dataset.p);
    q.querySelector(".n").textContent=n;
    q.querySelector(".n").classList.toggle("hide",n===0);
    q.querySelector(".minus").classList.toggle("hide",n===0);
    q.querySelector(".plus").classList.toggle("add",n===0);
  });
  totalEl.textContent=t+" د";
  bar.classList.toggle("show",t>0);
}
menu.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var k=b.parentNode.dataset.k;
  qty[k]=Math.max(0,qty[k]+(b.classList.contains("plus")?1:-1));refresh();
});
document.getElementById("clear").onclick=function(){for(var k in qty)qty[k]=0;refresh()};
var io=new IntersectionObserver(function(es){
  es.forEach(function(e){
    if(e.isIntersecting){
      document.querySelectorAll("nav a").forEach(function(a){a.classList.remove("on")});
      var a=document.getElementById("n-"+e.target.id);a.classList.add("on");
      nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.clientWidth/2,behavior:"smooth"});
    }
  });
},{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section").forEach(function(s){io.observe(s)});
document.getElementById("n-brioche").classList.add("on");
</script>
</body>
